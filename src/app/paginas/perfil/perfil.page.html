<ion-content [fullscreen]="true">
  <div class="cabecera-perfil">
    <div class="avatar">M</div>
    <h2>Marlo Jompero</h2>
    <p>Marlo</p>
    <div class="estadisticas">
      <div><strong>4.7<ion-icon name="star"></ion-icon></strong><span>Valoraciones</span></div>
      <div><strong>35</strong><span>Prendas</span></div>
      <div><strong>20</strong><span>Prestados</span></div>
    </div>
  </div>
  <p class="titulo-grupo">Preferencias</p>
  <ion-list [inset]="true">
    <ion-item>
      <ion-icon slot="start" name="moon-outline"></ion-icon>
      <ion-toggle (ionChange)="cambiarTema($event)">Modo oscuro</ion-toggle>
    </ion-item>
    <ion-item>
      <ion-icon slot="start" name="notifications-outline"></ion-icon>
      <ion-toggle [checked]="true">Avisos diarios</ion-toggle>
    </ion-item>
    <ion-item [button]="true" [detail]="true">
      <ion-icon slot="start" name="information-circle-outline"></ion-icon>
      <ion-label>Acerca de y créditos</ion-label>
    </ion-item>
  </ion-list>
  <ion-list [inset]="true">
    <ion-item [button]="true" routerLink="/login" routerDirection="root" class="salir">
      <ion-icon slot="start" name="log-out-outline" color="danger"></ion-icon>
      <ion-label color="danger">Cerrar sesión</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
