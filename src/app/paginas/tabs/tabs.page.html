<ion-tabs>
  <ion-tab tab="perfil">
    <div id="perfil-page" class="ion-page">
      <ion-header>
        <ion-toolbar>
          <ion-title>Perfil</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding">
        Bienvenido a tu perfil
      </ion-content>
    </div>
  </ion-tab>

  <ion-tab tab="prendas">
    <div id="prendas-page" class="ion-page">
      <ion-header>
        <ion-toolbar>
          <ion-title>Prendas</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding">
        Aquí aparecerán tus prendas
      </ion-content>
    </div>
  </ion-tab>

  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="perfil">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="prendas">
      <ion-icon name="shirt-outline"></ion-icon>
      <ion-label>Prendas</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
