
<ion-content [fullscreen]="true">

  <div class="barra-movil">
    <span class="hora">9:41</span>

    <div class="iconos-movil">
      <ion-icon name="cellular"></ion-icon>
      <ion-icon name="wifi"></ion-icon>
      <ion-icon name="battery-full"></ion-icon>
    </div>
  </div>
  <!-- Buscador, campanita y perfil -->
  <div class="iconos-derecha">

    <div class="buscador-container">
      <ion-searchbar placeholder="Buscar prendas..."></ion-searchbar>

      <ion-button fill="clear" (click)="abrirDevoluciones()">
        <ion-icon name="notifications-outline"></ion-icon>
      </ion-button>
    </div>

    <ion-avatar class="avatar-perfil" routerLink="/app/perfil">
      <div class="avatar-letra">M</div>
    </ion-avatar>

  </div>

  <ion-modal [isOpen]="mostrarDevoluciones" (didDismiss)="cerrarDevoluciones()" cssClass="devoluciones-modal" [backdropDismiss]="true">

    <ng-template>

      <div class="popup-devoluciones">

        <div class="popup-header">
          <h2>Próximas devoluciones</h2>

          <button class="cerrar-popup" (click)="cerrarDevoluciones()">×</button>
        </div>

        <div class="lista-devoluciones">


          @for (prestamo of proximasDevoluciones; track prestamo.nombre){

          <div class="devolucion-card">
            <img src="assets/icon/camiseta.jpg" alt="Prenda">

            <div class="devolucion-info">
              <h3>{{ prestamo.nombre }}</h3>
              <p>Propietario: {{ prestamo.propietario }}</p>
            </div>

            <span class="dias-restantes">
              QUEDAN {{ prestamo.dias }} DÍAS
            </span>
          </div>

          }
          <a class="historial" routerLink="/app/historial" (click)="cerrarDevoluciones()">Ver todo mi historial de préstamos</a>
        </div>


      </div>
    </ng-template>
  </ion-modal>





  <div class="filtros">
    <ion-button class="todo">Todo</ion-button>
    <ion-button class="prestamo">Préstamo</ion-button>
    <ion-button class="intercambio">Intercambio</ion-button>
    <ion-button class="casual">Casual</ion-button>
    <ion-button class="deporte">Deporte</ion-button>
  </div>


  <app-tarjetas-home></app-tarjetas-home>

</ion-content>
