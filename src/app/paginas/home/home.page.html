<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Home</ion-title>
  </ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true">

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Home</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Buscador y campanita -->
  <div class="buscador-container">

    <ion-searchbar placeholder="Buscar prendas..."></ion-searchbar>

    <ion-button fill="clear">
      <ion-icon name="notifications-outline"></ion-icon>
    </ion-button>

  </div>


  <!-- Filtros -->
  <div class="filtros">
    <ion-button class="todo">Todo</ion-button>
    <ion-button class="prestamo">Préstamo</ion-button>
    <ion-button class="intercambio">Intercambio</ion-button>
    <ion-button class="casual">Casual</ion-button>
    <ion-button class="deporte">Deporte</ion-button>
  </div>

  <!-- Tarjetas -->
  <app-tarjetas-home></app-tarjetas-home>

</ion-content>
