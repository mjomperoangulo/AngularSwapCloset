
<ion-content [fullscreen]="true">


  <div class="barra-movil">
    <span class="hora">9:41</span>

    <div class="iconos-movil">
      <ion-icon name="cellular"></ion-icon>
      <ion-icon name="wifi"></ion-icon>
      <ion-icon name="battery-full"></ion-icon>
    </div>
  </div>


  <div class="cabecera-mensajes">
    <h1>Mensajes</h1>

    <ion-button class="boton-solicitudes" routerLink="/app/missolicitudes">
      Mis solicitudes
    </ion-button>
  </div>




  <div class="buscador-mensajes">
    <ion-searchbar placeholder="Buscar prendas, ropas, tallas..." [(ngModel)]="busqueda" (ionInput)="filtrarMensajes()" showClearButton="never"></ion-searchbar>
  </div>


  <div class="lista-mensajes">

    @for( mensaje of conversacionesFiltradas; track mensaje.nombre){
    <div class="mensaje" [routerLink]="mensaje.nombre === 'Laura Diaz' ? '/chat-detalleprestamo' : '/chat-detalle'">

      <img [src]="mensaje.imagen" alt="Foto de perfil">

      <div class="info-mensaje">
        <h3>{{ mensaje.nombre }}</h3>
        <p>{{ mensaje.ultimoMensaje }}</p>
      </div>

      <div class="info-derecha">
        <span class="hora-mensaje">{{ mensaje.hora }}</span>
      </div>

    </div>
    }
  </div>



</ion-content>
