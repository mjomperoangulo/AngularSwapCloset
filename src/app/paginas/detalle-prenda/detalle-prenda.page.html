<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>detalle-prenda</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">detalle-prenda</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="imagen-container">

    <img src="assets/icon/camiseta.jpg" alt="Prenda">

    <!-- Flecha para volver -->
    <ion-button class="boton-volver" fill="clear" (click)="volver()">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </ion-button>

    <!-- Corazón de favoritos -->
    <ion-button class="boton-favorito" fill="clear">
      <ion-icon name="heart-outline"></ion-icon>
    </ion-button>

  </div>










</ion-content>
