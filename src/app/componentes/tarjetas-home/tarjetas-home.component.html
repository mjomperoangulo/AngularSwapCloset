<ion-card [routerLink]="['/app/especies', home().id]" [button]="true">
  <div class="foto">
    <img [src]="home().foto" [alt]="home().nombreComun" loading="lazy" />
    <span class="favorita">
<ion-icon [name]="home().favorita ? 'heart' : 'heart-outline'"></ion-icon>
</span>
  </div>
  <div class="cuerpo">
    <h3>{{ home().nombreComun }}</h3>
    <p class="cientifico">{{ home().nombreCientifico }}</p>
    <div class="pie">
      <!-- aquí irá el chip de dificultad (15.5) -->
      <span class="temperatura">
<ion-icon name="thermometer-outline"></ion-icon>
        {{ home().temperatura.min }}–{{ home().temperatura.max }}°
</span>
    </div>
  </div>
</ion-card>
