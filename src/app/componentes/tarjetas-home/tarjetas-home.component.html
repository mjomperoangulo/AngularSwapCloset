

<div class="contenedor-tarjetas">

  @for (tarjeta of tarjetas; track tarjeta.id; let i = $index) {

    <ion-card class="entrada" [style.--orden]="i"  [routerLink]="tarjeta.ruta">

      <img [src] = "tarjeta.imagen" [alt]="tarjeta.nombre"/>

      <ion-card-header>
        <ion-card-title>{{tarjeta.nombre}}</ion-card-title>
        <ion-button>{{tarjeta.tipo}}</ion-button>
      </ion-card-header>
    </ion-card>

  }

</div>
